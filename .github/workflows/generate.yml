name: Generate User Subscriptions

on:
  push:
    branches: [ main ]
    paths:
      - 'users.json'
      - 'generate.py'
      - 'keys/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run
        run: python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subs/*.txt
          git diff --cached --quiet || git commit -m "Update subs"
          git push
